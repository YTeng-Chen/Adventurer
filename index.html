<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冒險者 ADVENTURE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Pixelify+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <h1 class="brand">冒險者 <span class="en">ADVENTURE</span></h1>
    <div class="hud" id="hud"></div>
  </div>
</header>

<main class="layout">
  <section class="hero-panel" aria-label="角色">
    <div class="scene-wrap"><canvas id="scene" aria-label="角色目前所在的地點"></canvas></div>
    <div id="heroInfo"></div>
    <div class="log-box">
      <h2 class="mini-h">最近發生的事</h2>
      <ul class="log" id="log"></ul>
    </div>
  </section>

  <section class="main-panel">
    <nav class="tabs" role="tablist" aria-label="遊戲功能">
      <button class="tab" role="tab" data-tab="idle" id="tab-idle">掛機地點</button>
      <button class="tab" role="tab" data-tab="gear" id="tab-gear">裝備與背包</button>
      <button class="tab" role="tab" data-tab="hunt" id="tab-hunt">魔物狩獵</button>
      <button class="tab" role="tab" data-tab="trial" id="tab-trial">神之試煉</button>
    </nav>
    <div id="panel" class="panel" role="tabpanel"></div>
  </section>
</main>

<footer class="foot">
  <span>第一版原型・進度存在這個瀏覽器</span>
  <button class="btn ghost small" data-act="ff" id="ffBtn">快轉 1 小時（測試用）</button>
  <button class="btn ghost small" data-act="reset-ask" id="resetBtn">重新開始</button>
</footer>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="js/core/rng.js"></script>
<script src="js/core/data.js"></script>
<script src="js/core/stats.js"></script>
<script src="js/core/items.js"></script>
<script src="js/core/combat.js"></script>
<script src="js/core/world.js"></script>
<script src="js/core/trial.js"></script>
<script src="js/core/save.js"></script>
<script src="js/ui/sprites.js"></script>
<script src="js/ui/app.js"></script>
</body>
</html>
