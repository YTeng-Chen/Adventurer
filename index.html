<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冒險者 ADVENTURE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Pixelify+Sans:wght@400;600;700&display=swap">
</head>
<body>
<main class="app">
  <header class="top" id="hud"></header>

  <section class="stage-wrap" id="stageWrap" aria-label="戰鬥畫面" hidden>
    <div class="stage" id="stage"></div>
    <div class="battle-bar" id="battleBar" hidden>
      <div class="row spread"><h2 id="bTitle">戰鬥</h2><button class="btn ghost small" data-act="b-skip" id="bSkip">跳過</button></div>
      <ul class="blog" id="bLog" aria-live="polite"></ul>
      <div id="bResult"></div>
    </div>
  </section>

  <nav class="tiles" id="tiles" aria-label="遊戲功能"></nav>

  <section id="panel" class="panel"></section>
</main>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
