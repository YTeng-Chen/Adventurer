<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冒險者骨架動畫原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Pixelify+Sans:wght@600&display=swap">
<style>
/* 版面：左邊遊戲舞台（3D 像素風角色＋同外觀的 2D 版對照），右邊選項。和遊戲同一套夜色＋燈火金。 */
:root {
  --bg: #12161f; --panel: #1a2130; --panel-2: #222b3c; --line: #34405a; --ink: #ece4d2; --muted: #9ba5b9;
  --gold: #f2b84b; --shadow: #0a0d13; --sky: #2a3554; --ground: #4e6a3f;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --pixel: "Pixelify Sans", "Noto Sans TC", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 900; letter-spacing: .06em; text-wrap: balance; }
h1 span { font-family: var(--pixel); color: var(--gold); font-size: 1rem; margin-left: 8px; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: 16px; align-items: start; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--panel); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); padding: 14px; min-width: 0; }
.stage { position: relative; background: var(--sky); border: 2px solid var(--line); aspect-ratio: 240 / 160; width: 100%; overflow: hidden; }
.stage canvas { position: absolute; image-rendering: pixelated; }
#stage { left: 0; top: 0; width: 100%; height: 100%; }
#c2d { right: 3%; bottom: 20%; }
.tag { position: absolute; font-size: .75rem; color: var(--muted); background: rgba(10, 13, 19, .7); padding: 1px 6px; }
.tag.l { left: 8px; top: 8px; } .tag.r { right: 8px; top: 8px; }
.group { display: flex; flex-direction: column; gap: 6px; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.label { font-size: .8rem; color: var(--muted); letter-spacing: .12em; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { font: inherit; color: var(--ink); background: var(--panel-2); border: 2px solid var(--line); padding: 4px 12px; cursor: pointer; font-size: .9rem; }
.seg button[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); background: #2c2a26; }
.seg i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 2px solid var(--shadow); vertical-align: -1px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
input[type=range] { width: 100%; accent-color: var(--gold); }
label.check { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: .9rem; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>骨架動畫原型 <span>ADVENTURE</span></h1>
    <p class="hint">角色直接取自你的參考圖（側面與正面），切成頭、身體、手、腿幾個零件，掛在關節上動。裝備照零件的形狀上色，換裝後所有動作都能用。</p>
  </div>
  <div class="layout">
    <section class="box" aria-label="舞台">
      <div class="stage"><canvas id="stage" aria-label="角色與史萊姆"></canvas></div>
    </section>
    <section class="box opts" aria-label="選項">
      <div class="group"><span class="label">動作</span><div class="seg" id="anims"></div></div>
      <div class="group"><span class="label">視角</span><div class="seg" id="view"></div></div>
      <div class="group"><span class="label">性別</span><div class="seg" id="gender"></div></div>
      <div class="group"><span class="label">髮色</span><div class="seg" id="hair"></div></div>
      <div class="group"><span class="label">服裝</span><div class="seg" id="gear"></div></div>
      <div class="group"><span class="label">稀有度</span><div class="seg" id="rarity"></div></div>
      <div class="group"><span class="label">材料階級</span><div class="seg" id="tier"></div></div>
      <p class="hint">「揮砍」和「跳斬」播完會回到待機或走路。稀有度和材料階級只對劍士、守衛、術士三套裝備有作用。</p>
    </section>
  </div>
</div>
<script type="module" src="./rig.js"></script>
</body>
</html>
