<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>人物樣式比較</title>
<style>
  body { margin: 0; padding: 20px; background: #1d2740; color: #ece4d2; font: 14px/1.5 "Noto Sans TC", system-ui, sans-serif; }
  #board { display: inline-flex; gap: 18px; padding: 18px; background: #222b3c; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 210px; }
  .big { image-rendering: pixelated; background: linear-gradient(#3b4a70 0 78%, #4e6a3f 78%); }
  .small { image-rendering: pixelated; }
  .num { font-size: 22px; font-weight: 900; color: #f2b84b; }
  figcaption { text-align: center; }
  figcaption b { display: block; font-size: 16px; }
  figcaption span { color: #9ba5b9; font-size: 12px; }
</style>
</head>
<body>
<div id="board"></div>
<script type="module">
import { STYLES } from './styles.js';
import { sprites as S } from '../src/ui/sprites.js';
const board = document.getElementById('board');
for (const st of STYLES) {
  const g = st.make();
  const f = document.createElement('figure');
  const n = document.createElement('div'); n.className = 'num'; n.textContent = st.id; f.append(n);
  const big = document.createElement('canvas'); big.className = 'big';
  big.width = 48 * 4; big.height = 56 * 4;
  S.draw(big.getContext('2d'), g, 0, 0, 4); f.append(big);
  const small = document.createElement('canvas'); small.className = 'small';
  small.width = 48 * 2; small.height = 56 * 2;
  S.draw(small.getContext('2d'), g, 0, 0, 2); f.append(small);
  const cap = document.createElement('figcaption');
  cap.innerHTML = `<b>${st.name}</b><span>${st.note}</span>`;
  f.append(cap);
  board.append(f);
}
</script>
</body>
</html>
