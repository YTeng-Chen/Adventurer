<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>像素圖預覽</title>
<style>
  body { margin: 0; padding: 16px; background: #1d2740; color: #ece4d2; font: 13px/1.5 system-ui, sans-serif; }
  h2 { margin: 18px 0 6px; font-size: 15px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  figure { margin: 0; text-align: center; }
  figcaption { font-size: 11px; color: #9ba5b9; }
  canvas { image-rendering: pixelated; background: #2a3554; }
</style>
</head>
<body>
<p>開發用：檢查角色、裝備、魔物像素圖。執行 <code>npm run dev</code> 後開 <code>/tools/sprites.html</code>。</p>
<div id="out"></div>
<script type="module">
import { sprites as S } from '../src/ui/sprites.js';
import { data as D } from '../src/core/data.js';

const out = document.getElementById('out');
function show(grid, scale, label, parent) {
  const c = document.createElement('canvas');
  c.width = grid[0].length * scale; c.height = grid.length * scale;
  S.draw(c.getContext('2d'), grid, 0, 0, scale);
  const f = document.createElement('figure');
  f.append(c);
  const cap = document.createElement('figcaption'); cap.textContent = label; f.append(cap);
  parent.append(f);
}
function section(title) {
  const h = document.createElement('h2'); h.textContent = title; out.append(h);
  const r = document.createElement('div'); r.className = 'row'; out.append(r); return r;
}
// 預覽用的整套外觀（gear.js 的 look）
const OUTFITS = {
  劍與皮甲: { weapon: 'sword', head: 'cap', body: 'leather', feet: 'boots' },
  鎚與板甲: { weapon: 'hammer', head: 'helm', body: 'plate', feet: 'greaves' },
  法杖與法袍: { weapon: 'staff', head: 'wizard', body: 'robe', feet: 'shoes' },
};
const gear = (type, look, tier, rarity) => ({ type, look, form: type === 'weapon' ? look : undefined, tier, rarity });
const set = (name, tier, rarity) => Object.fromEntries(Object.entries(OUTFITS[name]).map(([k, look]) => [k, gear(k, look, tier, rarity)]));
const LOOKS = [{ gender: '男', style: '中分', color: '栗棕' }, { gender: '女', style: '高馬尾', color: '粉紅' }];

const bodies = section('身體與髮型（沒穿裝備）');
for (const [g, styles] of Object.entries(S.GENDER_STYLES)) for (const st of styles) show(S.heroGrid({}, { gender: g, style: st, color: g === '男' ? '栗棕' : '粉紅' }), 2, `${g}・${st}`, bodies);
for (const look of LOOKS) {
  for (const name of Object.keys(OUTFITS)) {
    const r1 = section(`${look.gender}・${name}：稀有度（階級 3）`);
    for (let r = 0; r < 5; r++) show(S.heroGrid(set(name, 3, r), look), 2, D.RARITY[r].n, r1);
  }
}
const tiers = section('材料階級（劍與皮甲、精良）');
for (let t = 1; t <= 5; t++) show(S.heroGrid(set('劍與皮甲', t, 1), LOOKS[0]), 2, 'T' + t, tiers);
const mix = section('混搭');
show(S.heroGrid({ weapon: gear('weapon', 'sword', 2, 3), head: gear('head', 'wizard', 2, 2), body: gear('body', 'plate', 3, 1), feet: gear('feet', 'boots', 1, 0) }, LOOKS[1]), 3, '劍＋法帽＋板甲', mix);
show(S.heroGrid({ weapon: gear('weapon', 'staff', 4, 4), body: gear('body', 'leather', 4, 4), feet: gear('feet', 'greaves', 5, 2) }, { gender: '女', style: '長直髮', color: '藍黑' }), 3, '法杖＋皮甲', mix);
const icons = section('背包圖示');
const LOOKS_BY_TYPE = {};
for (const g of D.GEAR) (LOOKS_BY_TYPE[g.type] ||= new Set()).add(g.look);
for (const [type, looks] of Object.entries(LOOKS_BY_TYPE)) for (const lk of looks) for (const r of type === 'acc' ? [1, 4] : [3]) show(S.itemIconGrid(gear(type, lk, 3, r)), 3, `${type}/${lk}${type === 'acc' ? D.RARITY[r].n : ''}`, icons);
const mons = section('魔物（放大後）');
for (const a of D.AREAS) for (const m of [...a.monsters, a.boss]) show(S.enemyGrid(m.shape, m.c), 3, m.n, mons);
</script>
</body>
</html>
