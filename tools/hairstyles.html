<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>冒險者髮型挑選</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Pixelify+Sans:wght@600&display=swap">
<style>
/* 版面：左邊大預覽（遊戲背景上），右邊選項：性別、髮色、髮型卡片。和遊戲同一套夜色＋燈火金。 */
:root {
  --bg: #12161f; --panel: #1a2130; --panel-2: #222b3c; --line: #34405a; --ink: #ece4d2; --muted: #9ba5b9;
  --gold: #f2b84b; --shadow: #0a0d13; --stage: #2a3554; --ground: #4e6a3f;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --pixel: "Pixelify Sans", "Noto Sans TC", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.6;
  padding-block: 20px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1 { margin: 0; font-size: 1.4rem; font-weight: 900; letter-spacing: .06em; text-wrap: balance; }
h1 span { font-family: var(--pixel); color: var(--gold); font-size: 1rem; margin-left: 8px; }
.hint { color: var(--muted); font-size: .88rem; margin: 0; }
.layout { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 760px) { .layout { grid-template-columns: minmax(0, 1fr); } }
.box { background: var(--panel); border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--shadow); padding: 14px; min-width: 0; }
.preview { display: flex; flex-direction: column; gap: 10px; align-items: center; }
#big { width: 100%; max-width: 300px; image-rendering: pixelated; display: block; }
#name { font-weight: 900; font-size: 1.1rem; margin: 0; }
.group { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: .8rem; color: var(--muted); letter-spacing: .12em; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button, .swatch {
  font: inherit; color: var(--ink); background: var(--panel-2); border: 2px solid var(--line); padding: 6px 16px; cursor: pointer;
}
.seg button[aria-pressed="true"] { border-color: var(--gold); background: #2c2a26; box-shadow: inset 0 0 0 1px var(--gold); }
.swatch { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; }
.swatch i { width: 16px; height: 16px; display: inline-block; border: 2px solid var(--shadow); }
.swatch[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; }
.card {
  font: inherit; color: var(--ink); background: var(--stage); border: 2px solid var(--line); padding: 8px 6px 6px; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
}
.card canvas { width: 102px; height: auto; image-rendering: pixelated; }
.card[aria-pressed="true"] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.card span { font-size: .86rem; font-weight: 700; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>髮型挑選 <span>ADVENTURE</span></h1>
    <p class="hint">選性別、髮色和髮型（男生、女生各 3 種），左邊是放大的樣子和遊戲裡的實際大小。這是角色建立畫面的試做。</p>
  </div>
  <div class="layout">
    <section class="box preview" aria-label="預覽">
      <canvas id="big" width="320" height="400" aria-label="角色預覽"></canvas>
      <p id="name"></p>
    </section>
    <section class="box group" aria-label="選項">
      <div class="group"><span class="label">性別</span><div class="seg" id="gender"></div></div>
      <div class="group"><span class="label">髮色</span><div class="seg" id="colors"></div></div>
      <div class="group"><span class="label">髮型</span><div class="cards" id="cards"></div></div>
    </section>
  </div>
</div>
<script type="module">
import { HAIR } from './hairstyles-data.js';

const W = HAIR.W, H = HAIR.H;
const state = { gender: '男', color: '栗棕', style: HAIR.styles['男'][0] };
try { Object.assign(state, JSON.parse(localStorage.getItem('hair-pick') || '{}')); } catch (e) { /* 沒有存過就用預設 */ }
const stylesOf = () => HAIR.styles[state.gender] || HAIR.styles['男'];
if (!HAIR.styles[state.gender]) state.gender = '男';
if (!stylesOf().includes(state.style)) state.style = stylesOf()[0];
if (!HAIR.hairColors[state.color]) state.color = '栗棕';

function pal() {
  const [D, Hc, M, L] = HAIR.hairColors[state.color];
  return { ...HAIR.pal, D, H: Hc, M, L };
}
function draw(ctx, rows, scale, ox, oy) {
  const p = pal();
  rows.forEach((row, y) => [...row].forEach((c, x) => {
    if (c === '.') return;
    ctx.fillStyle = p[c];
    ctx.fillRect(ox + x * scale, oy + y * scale, scale, scale);
  }));
}
function sprite(style) { return HAIR.sprites[`${state.gender}-${style}`]; }

function renderBig() {
  const cv = document.getElementById('big'), ctx = cv.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#2a3554'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = '#4e6a3f'; ctx.fillRect(0, 360, cv.width, 40);
  const rows = sprite(state.style);
  draw(ctx, rows, 3, 10, 360 - 105 * 3 + 6);
  // 遊戲裡的實際大小
  draw(ctx, rows, 1, cv.width - W - 12, 360 - 105 + 2);
  document.getElementById('name').textContent = `${state.style}・${state.color}・${state.gender === '男' ? '男生' : '女生'}`;
}
function renderOptions() {
  const g = document.getElementById('gender');
  g.innerHTML = ['男', '女'].map((k) => `<button type="button" data-g="${k}" aria-pressed="${state.gender === k}">${k === '男' ? '男生' : '女生'}</button>`).join('');
  const c = document.getElementById('colors');
  c.innerHTML = Object.entries(HAIR.hairColors).map(([k, v]) => `<button type="button" class="swatch" data-c="${k}" aria-pressed="${state.color === k}"><i style="background:${v[1]}"></i>${k}</button>`).join('');
  const cards = document.getElementById('cards');
  cards.innerHTML = stylesOf().map((s, i) => `<button type="button" class="card" data-s="${s}" aria-pressed="${state.style === s}"><canvas width="${W * 2}" height="${64 * 2}"></canvas><span>${i + 1} ${s}</span></button>`).join('');
  cards.querySelectorAll('canvas').forEach((cv, i) => {
    const ctx = cv.getContext('2d');
    draw(ctx, sprite(stylesOf()[i]).slice(0, 64), 2, 0, 0);
  });
}
function render() {
  renderOptions(); renderBig();
  try { localStorage.setItem('hair-pick', JSON.stringify(state)); } catch (e) { /* 無法儲存就算了 */ }
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.g && b.dataset.g !== state.gender) { state.gender = b.dataset.g; state.style = stylesOf()[0]; }
  if (b.dataset.c) state.color = b.dataset.c;
  if (b.dataset.s) state.style = b.dataset.s;
  render();
});
render();
</script>
</body>
</html>
